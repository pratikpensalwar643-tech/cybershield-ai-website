<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - AI Cyber Threat Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body{overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(6,182,212,.08),transparent 28%),#020617}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(34,211,238,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.08) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
.card{animation:cardIn .65s ease-out both;backdrop-filter:blur(10px)}
.logo{position:relative;width:80px;height:80px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:linear-gradient(145deg,rgba(8,47,73,.95),rgba(15,23,42,.98));border:1px solid rgba(34,211,238,.45);box-shadow:0 0 0 5px rgba(34,211,238,.035),0 0 28px rgba(34,211,238,.12);animation:float 4s ease-in-out infinite}
.logo:before{content:"";position:absolute;inset:-1px;border-radius:22px;border:1px solid rgba(34,211,238,.18);animation:pulse 2.8s ease-in-out infinite}.shield{font-size:38px;color:#22d3ee;filter:drop-shadow(0 0 7px rgba(34,211,238,.45))}.node{position:absolute;width:6px;height:6px;border-radius:999px;background:#67e8f9;box-shadow:0 0 8px rgba(103,232,249,.75)}.n1{top:17px;right:19px}.n2{bottom:18px;left:18px}.n3{bottom:22px;right:16px}
.field{transition:.2s}.field:focus{box-shadow:0 0 0 3px rgba(34,211,238,.08);transform:translateY(-1px)}
.btn{transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(8,145,178,.20)}
.msg{animation:msgIn .25s ease-out both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.045)}}
@keyframes msgIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.card,.logo,.logo:before,.msg{animation:none!important}}
</style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-4">
<div class="w-full max-w-md">
<div class="card bg-slate-900/90 border border-slate-700 rounded-2xl shadow-2xl p-8">
<div class="text-center mb-7">
<div class="logo"><i class="fas fa-shield-halved shield"></i><span class="node n1"></span><span class="node n2"></span><span class="node n3"></span></div>
<h1 class="text-2xl font-bold">Create <span class="text-cyan-400">Account</span></h1>
<p class="text-slate-400 text-sm mt-2">Join the AI Cyber Threat Intelligence dashboard</p>
</div>
<form id="registerForm" class="space-y-5">
<div><label class="block text-sm text-slate-300 mb-2">Username</label><div class="relative"><i class="fas fa-user absolute left-4 top-3.5 text-slate-500"></i><input id="username" type="text" minlength="3" maxlength="100" autocomplete="username" required class="field w-full bg-slate-800 border border-slate-700 rounded-lg pl-11 pr-4 py-3 outline-none focus:border-cyan-400" placeholder="Choose a username"></div></div>
<div><label class="block text-sm text-slate-300 mb-2">Password</label><div class="relative"><i class="fas fa-lock absolute left-4 top-3.5 text-slate-500"></i><input id="password" type="password" minlength="6" autocomplete="new-password" required class="field w-full bg-slate-800 border border-slate-700 rounded-lg pl-11 pr-12 py-3 outline-none focus:border-cyan-400" placeholder="Create a password"><button type="button" id="togglePassword" class="absolute right-4 top-3.5 text-slate-500 hover:text-white"><i class="fas fa-eye"></i></button></div><p class="text-xs text-slate-500 mt-2">Use at least 6 characters.</p></div>
<div id="message" class="hidden rounded-lg p-3 text-sm"></div>
<button id="registerButton" type="submit" class="btn w-full bg-cyan-600 hover:bg-cyan-500 rounded-lg py-3 font-semibold"><i class="fas fa-user-plus mr-2"></i>Create Account</button>
</form>
<p class="text-center text-sm text-slate-500 mt-6">Already have an account? <a href="/login" class="text-cyan-400 hover:text-cyan-300 font-medium">Login</a></p>
<p class="text-center text-xs text-slate-600 mt-4">New accounts are standard user accounts.</p>
</div></div>
<script>
const form=document.getElementById('registerForm'), msg=document.getElementById('message'), btn=document.getElementById('registerButton');
document.getElementById('togglePassword').onclick=()=>{const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';document.querySelector('#togglePassword i').classList.toggle('fa-eye');document.querySelector('#togglePassword i').classList.toggle('fa-eye-slash')};
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='hidden';btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i> Creating...';try{const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed.');msg.className='msg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 rounded-lg p-3 text-sm';msg.textContent='Account created successfully. Redirecting to login...';setTimeout(()=>window.location.href='/login',900)}catch(err){msg.className='msg bg-red-500/10 border border-red-500/30 text-red-300 rounded-lg p-3 text-sm';msg.textContent=err.message;btn.disabled=false;btn.innerHTML='<i class="fas fa-user-plus mr-2"></i>Create Account'}});
</script>
</body>
</html>
